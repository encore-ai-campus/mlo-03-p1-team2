<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7138ec">
  <title>회원가입 — TIKIT 티킷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/signup.js" defer></script>
</head>
<body>
  <header>
    <div class="header-main wrap">
      <a href="./" class="logo" aria-label="티킷 홈">ti<span>k</span>it<span class="logo-dot">.</span></a>
      <form class="search" action="./" method="get" role="search">
        <input name="q" type="search" maxlength="100" placeholder="어떤 설렘을 찾고 있나요?" aria-label="공연 검색">
        <button aria-label="검색" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
      </form>
      <div class="account" id="account"></div>
    </div>
    <nav class="wrap nav" aria-label="공연 카테고리"><div class="genre-nav" id="genreNav"></div></nav>
  </header>

  <main class="auth-main">
    <div class="wrap">
      <div class="auth-card">
        <div class="auth-visual">
          <img src="https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=900&q=80" alt="">
          <div class="hero-sticker">FEEL<br>YOUR<br><span>VIBE</span></div>
          <div class="eyebrow"><span class="live-dot"></span> JOIN TIKIT</div>
          <h1>나의 취향,<br>티킷에서 <em>시작해요.</em></h1>
          <p>MBTI는 공연 취향을 이해하는 데 사용됩니다.<br>가입하고 나를 닮은 설렘을 만나보세요.</p>
        </div>
        <div class="auth-form">
          <div class="section-kicker">SIGN UP</div>
          <h2>회원가입</h2>
          <p class="modal-intro">설레는 순간을 함께 찾아요.</p>
          <form id="signupForm" novalidate>
            <label class="form-field"><span>닉네임 <span class="required">*</span></span><input name="nickname" required maxlength="20" autocomplete="nickname" placeholder="티킷에서 사용할 이름" autofocus></label>
            <label class="form-field"><span>이메일 <span class="required">*</span></span><input name="email" type="email" required maxlength="100" autocomplete="email" placeholder="hello@example.com"></label>
            <label class="form-field"><span>비밀번호 <span class="required">*</span></span><span class="password-control"><input name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="8~128자 입력"><button type="button" data-toggle-password="password" aria-label="비밀번호 표시" aria-pressed="false">보기</button></span></label>
            <label class="form-field"><span>비밀번호 확인 <span class="required">*</span></span><span class="password-control"><input name="passwordConfirm" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="비밀번호를 다시 입력해 주세요"><button type="button" data-toggle-password="passwordConfirm" aria-label="비밀번호 확인 표시" aria-pressed="false">보기</button></span></label>
            <p class="field-title" id="mbtiTitle">나의 MBTI <span class="required">* 필수</span></p>
            <div class="mbti-options" id="mbtiOptions" role="radiogroup" aria-labelledby="mbtiTitle"></div>
            <label class="check-label"><input type="checkbox" name="consent" required><span>[필수] MBTI·공연 조회·모의 예매 내역을 공연 취향 분석 목적으로 수집하는 데 동의합니다. 데이터는 티킷 서버에 보관되며, 마이티킷에서 삭제할 수 있습니다.</span></label>
            <div class="demo-note">시연용 서비스입니다. 비밀번호는 서버에 원문 대신 해시값으로만 저장됩니다. 실제 사용하는 비밀번호는 입력하지 마세요.</div>
            <p class="form-error" role="alert" hidden></p>
            <button class="primary" type="submit">동의하고 시작하기</button>
          </form>
          <p class="switch-link">이미 계정이 있나요?<a id="toLogin" href="login.html">로그인</a></p>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
