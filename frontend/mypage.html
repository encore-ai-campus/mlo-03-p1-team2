<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7138ec">
  <title>마이페이지 — TIKIT 티킷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/mypage.js" defer></script>
</head>
<body>
  <header>
    <div class="header-main wrap">
      <a href="./" class="logo" aria-label="티킷 홈">ti<span>k</span>it<span class="logo-dot">.</span></a>
      <form class="search" action="./" method="get" role="search">
        <input name="q" type="search" maxlength="100" placeholder="어떤 설렘을 찾고 있나요?" aria-label="공연 검색">
        <button aria-label="검색" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
      </form>
      <div class="account" id="account"></div>
    </div>
    <nav class="wrap nav" aria-label="공연 카테고리"><div class="genre-nav" id="genreNav"></div></nav>
  </header>

  <main class="mypage-main">
    <div class="wrap">
      <div class="mypage-head">
        <div class="section-kicker">MY PAGE</div>
        <h1>마이페이지 <span>✦</span></h1>
      </div>

      <div class="mypage-layout" id="mypage" hidden>
        <aside class="mypage-side">
          <div class="mypage-profile">
            <span class="mypage-mbti" id="sideMbti"></span>
            <div><b id="sideName"></b><p id="sideEmail"></p></div>
          </div>
          <nav class="mypage-menu" id="mypageMenu" aria-label="마이페이지 메뉴"></nav>
        </aside>
        <section class="mypage-panel" id="panel" aria-live="polite"></section>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap footer-main">
      <a href="./" class="logo">tikit.</a>
      <div>
        <p>취향이 만나는 순간, 티킷 · TIKIT</p>
        <p class="muted">시연 서비스입니다. 공연 정보는 예시이며 실제 예매 및 결제가 진행되지 않습니다.</p>
        <small>© 2026 TIKIT. All moments reserved.</small>
      </div>
      <span class="footer-note">FIND YOUR NEXT<br><em>FAVORITE MOMENT.</em></span>
    </div>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
