# /etc/haproxy/haproxy.cfg 맨 아래에 추가합니다. (HAProxy 179, 181)
# 사전 확인: haproxy -vv | grep -i prometheus  →  "prometheus-exporter" 가 보여야 합니다.

frontend prometheus
    bind 127.0.0.1:8405
    mode http
    no log
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404 unless { path /metrics }

# ---------------------------------------------------------------------
# 179(백엔드 HAProxy) 전용: FastAPI 의 /metrics 가 외부로 노출되지 않도록
# 기존 frontend webserver 블록 안에 아래 한 줄을 추가합니다.
#
#   frontend webserver
#       ...
#       http-request deny deny_status 404 if { path_beg /metrics }
# ---------------------------------------------------------------------
