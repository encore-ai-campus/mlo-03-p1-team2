# /etc/loki/config.yml (mon-logs, 192.168.0.186)
# Loki 3.x 단일 바이너리(monolithic) + 로컬 파일시스템 저장소
# Grafana apt 패키지의 loki.service 가 이 경로를 읽습니다.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h   # retention 을 쓰려면 24h 고정

# 보관 기간이 지난 로그를 실제로 삭제하는 것은 compactor 입니다.
# retention_period 만 설정하면 디스크가 비워지지 않습니다.
compactor:
  working_directory: /var/lib/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  delete_request_store: filesystem

limits_config:
  retention_period: 72h            # 3일. 디스크 여유를 보고 168h(7일)까지 늘림

  # 수집 폭주 방지
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_global_streams_per_user: 1000
  max_label_names_per_series: 10
  reject_old_samples: true
  reject_old_samples_max_age: 24h

  # 무거운 쿼리 방지 (Grafana 에서 긴 기간을 조회할 때 노트북 부하 제한)
  max_query_series: 500
  max_query_parallelism: 4
  max_query_length: 168h
  max_entries_limit_per_query: 5000

  allow_structured_metadata: true
  volume_enabled: true

querier:
  max_concurrent: 4

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# 소규모 환경에서는 불필요한 기능을 꺼서 메모리를 아낍니다.
pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
