# /etc/nginx/conf.d/monitoring.conf (nginx 177, 178)
# conf.d 는 http { } 블록 안에서 include 되므로 log_format 과 server 를 함께 둘 수 있습니다.

# JSON 접근 로그: Alloy 가 파싱 없이 필드를 꺼낼 수 있어 CPU 사용이 적습니다.
# real_ip.conf 가 적용되어 있으므로 $remote_addr 는 실제 사용자 IP 입니다.
log_format json_access escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":"$status",'
    '"bytes":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"upstream_time":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"'
  '}';

# 기존 access.log 대신 JSON 로그만 남겨 디스크 쓰기를 한 번으로 줄입니다.
# (sites-available/default 의 server 블록에 access_log 가 따로 있다면 그쪽도 아래로 교체)
access_log /var/log/nginx/access.json.log json_access;

# nginx-prometheus-exporter 가 읽는 상태 페이지 (로컬 전용)
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
