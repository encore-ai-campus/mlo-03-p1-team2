<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>모의 결제 완료와 예매 취소</title><desc>Sources: frontend/src/composables/useReservations.js; backend/app/api/routes/reservations.py:change_reservation; app/models/reservation.py.
Common JWT authentication and current user lookup are omitted from this detailed view; see request overview. SELECT is constrained by reservation id AND current user id, with FOR UPDATE(of=Reservation). Payment relationship is lazy=joined. Not found and another user reservation both return 404. Repeating an action already at its target returns the existing object without new history. Attempting complete on CANCELLED gives 409. complete sets reservation CONFIRMED and payment COMPLETED; cancel sets both CANCELLED. The handler records two StatusHistory rows and optional consent-based Event, and commits once. These are simulated payments; there is no third-party payment processor, approval callback, or actual refund. Existing completed_at and amount are retained on cancel.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="62" y="42" width="7" height="42" fill="#2F75B5" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="87" data-y="36" data-width="1420" data-height="58"><text x="87" y="76.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="39" font-weight="700" fill="#17365D" text-anchor="start">모의 결제 완료와 예매 취소</text></g><g data-text-box="1" data-x="88" data-y="104" data-width="1400" data-height="38"><text x="88" y="124.8" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="20" font-weight="400" fill="#627187" text-anchor="start">POST /api/v1/reservations/{id}/complete 또는 /cancel  |  현재 사용자 인증 후 처리</text></g><polyline points="62,154 1538,154" fill="none" stroke="#CBD4DF" stroke-width="1" stroke-linejoin="miter"/><g data-text-box="1" data-x="64" data-y="858" data-width="1200" data-height="26"><text x="64" y="872.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="400" fill="#627187" text-anchor="start">TIKIT  /  BACKEND SEQUENCE</text></g><g data-text-box="1" data-x="1400" data-y="858" data-width="138" data-height="26"><text x="1538" y="872.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="400" fill="#627187" text-anchor="end">05 / 06</text></g><rect x="78" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="88" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="210.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">Vue 3</text></g><g data-text-box="1" data-x="88" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="210.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">useReservations.complete / cancel</text></g><polyline points="210,280 210,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="471" y="201" width="264" height="79" fill="#17365D" stroke="#17365D" stroke-width="1"/><g data-text-box="1" data-x="481" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="603.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">FastAPI</text></g><g data-text-box="1" data-x="481" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="603.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#E0EAF6" text-anchor="middle">change_reservation()</text></g><polyline points="603,280 603,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="864" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="874" data-