<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>사용자 행동 이벤트 수집</title><desc>Sources: frontend/src/utils/tracker.js; backend/app/api/routes/tracking.py; app/db/mongo.py; app/schemas/tracking.py.
The tracker emits a batch when queue reaches 10, or every 3 seconds if nonempty; visibility/pagehide flush uses keepalive. API validates schema; user_id is derived exclusively from a valid JWT; absent, expired or invalid JWT becomes anonymous (null), without MariaDB user lookup. Server adds user_agent and received_at. Mongo _id=event_id and insert_many(ordered=False) makes retries deduplicate. 202 is returned after insert_many finishes, not before background processing. Duplicate key errors are counted in duplicates; other storage errors are 503 and may have partially written data. Frontend retries network, 5xx,429 with same IDs on later flush, bounded in-memory queue drops older events. It is not a durable queue. Database tikit / collection events defaults are used. This pipeline is independent from MariaDB business-event persistence.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="62" y="42" width="7" height="42" fill="#2F75B5" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="87" data-y="36" data-width="1420" data-height="58"><text x="87" y="76.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="39" font-weight="700" fill="#17365D" text-anchor="start">사용자 행동 이벤트 수집</text></g><g data-text-box="1" data-x="88" data-y="104" data-width="1400" data-height="38"><text x="88" y="124.8" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="20" font-weight="400" fill="#627187" text-anchor="start">POST /api/v1/tracking/events  |  브라우저 이벤트를 배치로 전송해 MongoDB에 저장</text></g><polyline points="62,154 1538,154" fill="none" stroke="#CBD4DF" stroke-width="1" stroke-linejoin="miter"/><g data-text-box="1" data-x="64" data-y="858" data-width="1200" data-height="26"><text x="64" y="872.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="400" fill="#627187" text-anchor="start">TIKIT  /  BACKEND SEQUENCE</text></g><g data-text-box="1" data-x="1400" data-y="858" data-width="138" data-height="26"><text x="1538" y="872.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="400" fill="#627187" text-anchor="end">06 / 06</text></g><rect x="78" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="88" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="210.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">Vue 3</text></g><g data-text-box="1" data-x="88" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="210.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">tracker.js · 메모리 큐</text></g><polyline points="210,280 210,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="471" y="201" width="264" height="79" fill="#17365D" stroke="#17365D" stroke-width="1"/><g data-text-box="1" data-x="481" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="603.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">FastAPI</text></g><g data-text-box="1" data-x="481" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="603.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#E0EAF6" text-anchor="middle">tracking.collect_events()</text></g><polyline points="603,280 603,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="864" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="874" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="996.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">PyMongo</text></g><g data-text-box="1" data-x="874" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="996.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">Collection · insert_many</text></g><polyline points="996,280 996,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="1257" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="1267" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="1389.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">MongoDB</text></g><g data-text-box="1" data-x="1267" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="1389.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">tikit.events</text></g><polyline points="1389,280 1389,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><polyline points="210,316 245,316 245,341 210,341" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="210,341 219.0,337.2 219.0,344.8" fill="#2F75B5"/><g data-text-box="1" data-x="259" data-y="309" data-width="288" data-height="46"><text x="259" y="326.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#243448" text-anchor="start">이벤트를 큐에 모음</text><text x="259" y="349.12" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#243448" text-anchor="start">10건 또는 3초마다 전송</text></g><polyline points="210,397 603,397" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="603,397 594.0,400.8 594.0,393.2" fill="#2F75B5"/><rect x="223" y="368" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="223" data-y="368" data-width="23" data-height="22"><text x="234.5" y="382.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">1</text></g><g data-text-box="1" data-x="256" data-y="368" data-width="335" data-height="25"><text x="256" y="385.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#2F75B5" text-anchor="start">events[1~10] · JWT 선택</text></g><polyline points="603,440 638,440 638,465 603,465" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="603,465 612.0,461.2 612.0,468.8" fill="#2F75B5"/><g data-text-box="1" data-x="652" data-y="433" data-width="288" data-height="46"><text x="652" y="450.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#243448" text-anchor="start">형식 검증·서버 필드 추가</text><text x="652" y="473.12" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#243448" text-anchor="start">user_id는 JWT에서 추출</text></g><polyline points="603,526 996,526" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="996,526 987.0,529.8 987.0,522.2" fill="#2F75B5"/><rect x="616" y="497" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="616" data-y="497" data-width="23" data-height="22"><text x="627.5" y="511.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">2</text></g><g data-text-box="1" data-x="649" data-y="497" data-width="335" data-height="25"><text x="649" y="513.64" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#2F75B5" text-anchor="start">insert_many(ordered=False)</text></g><polyline points="996,585 1389,585" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="1389,585 1380.0,588.8 1380.0,581.2" fill="#2F75B5"/><rect x="1009" y="556" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="1009" data-y="556" data-width="23" data-height="22"><text x="1020.5" y="570.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">3</text></g><g data-text-box="1" data-x="1042" data-y="556" data-width="335" data-height="25"><text x="1042" y="573.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#2F75B5" text-anchor="start">_id = event_id 로 저장</text></g><polyline points="1389,644 996,644" fill="none" stroke="#627187" stroke-width="1.6" stroke-linejoin="miter" stroke-dasharray="7 5"/><polygon points="996,644 1005.0,640.2 1005.0,647.8" fill="#627187"/><g data-text-box="1" data-x="1008" data-y="615" data-width="369" data-height="25"><text x="1008" y="633.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#627187" text-anchor="start">저장 결과 / 중복 키</text></g><polyline points="996,703 603,703" fill="none" stroke="#627187" stroke-width="1.6" stroke-linejoin="miter" stroke-dasharray="7 5"/><polygon points="603,703 612.0,699.2 612.0,706.8" fill="#627187"/><g data-text-box="1" data-x="615" data-y="674" data-width="369" data-height="25"><text x="615" y="692.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#627187" text-anchor="start">신규 저장·중복 건수</text></g><polyline points="603,761 210,761" fill="none" stroke="#627187" stroke-width="1.6" stroke-linejoin="miter" stroke-dasharray="7 5"/><polygon points="210,761 219.0,757.2 219.0,764.8" fill="#627187"/><g data-text-box="1" data-x="222" data-y="732" data-width="369" data-height="25"><text x="222" y="749.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#627187" text-anchor="start">202 · accepted / duplicates</text></g><rect x="65" y="790" width="716" height="61" fill="#F3F6FA" stroke="none" stroke-width="1"/><rect x="65" y="790" width="3" height="61" fill="#2F75B5" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="80" data-y="798" data-width="688" data-height="21"><text x="80" y="814.64" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="700" fill="#17365D" text-anchor="start">분리된 저장 경로</text></g><g data-text-box="1" data-x="80" data-y="822" data-width="688" data-height="27"><text x="80" y="837.6" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="15" font-weight="400" fill="#627187" text-anchor="start">예매 트랜잭션과 별도의 요청 · MongoDB 이벤트가 업무 상태를 바꾸지는 않음</text></g><rect x="800" y="790" width="735" height="61" fill="#F3F6FA" stroke="none" stroke-width="1"/><rect x="800" y="790" width="3" height="61" fill="#2F75B5" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="815" data-y="798" data-width="707" data-height="21"><text x="815" y="814.64" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="700" fill="#17365D" text-anchor="start">실패·재전송</text></g><g data-text-box="1" data-x="815" data-y="822" data-width="707" data-height="27"><text x="815" y="837.6" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="15" font-weight="400" fill="#627187" text-anchor="start">저장 장애는 503 · 프론트엔드는 같은 event_id로 재전송해 중복 방지</text></g></svg>