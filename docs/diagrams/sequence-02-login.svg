<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>로그인과 JWT 발급</title><desc>Sources: frontend/src/stores/auth.js; frontend/src/api/client.js; backend/app/api/routes/auth.py; backend/app/core/security.py.
Emails are stripped and lowercased for lookup. Password verification uses pwdlib PasswordHash.recommended with argon2 dependency. An unknown email is checked against a dummy hash. Unknown accounts and wrong passwords return the same 401 response. JWT has sub/iat/exp and is signed using configured algorithm (HS256 by default), expires in 60 minutes by default. Frontend stores JWT in sessionStorage and profile in Pinia; no auth cookie or dedicated authentication server exists.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="62" y="42" width="7" height="42" fill="#2F75B5" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="87" data-y="36" data-width="1420" data-height="58"><text x="87" y="76.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="39" font-weight="700" fill="#17365D" text-anchor="start">로그인과 JWT 발급</text></g><g data-text-box="1" data-x="88" data-y="104" data-width="1400" data-height="38"><text x="88" y="124.8" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="20" font-weight="400" fill="#627187" text-anchor="start">POST /api/v1/auth/login  |  이메일 조회 → 비밀번호 검증 → 토큰 발급</text></g><polyline points="62,154 1538,154" fill="none" stroke="#CBD4DF" stroke-width="1" stroke-linejoin="miter"/><g data-text-box="1" data-x="64" data-y="858" data-width="1200" data-height="26"><text x="64" y="872.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="400" fill="#627187" text-anchor="start">TIKIT  /  BACKEND SEQUENCE</text></g><g data-text-box="1" data-x="1400" data-y="858" data-width="138" data-height="26"><text x="1538" y="872.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="400" fill="#627187" text-anchor="end">02 / 06</text></g><rect x="78" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="88" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="210.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">Vue 3</text></g><g data-text-box="1" data-x="88" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="210.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">LoginView · auth store</text></g><polyline points="210,280 210,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="471" y="201" width="264" height="79" fill="#17365D" stroke="#17365D" stroke-width="1"/><g data-text-box="1" data-x="481" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="603.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">FastAPI</text></g><g data-text-box="1" data-x="481" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="603.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#E0EAF6" text-anchor="middle">auth.login()</text></g><polyline points="603,280 603,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="864" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="874" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="996.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">SQLAlchemy</text></g><g data-text-box="1" data-x="874" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="996.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">Session</text></g><polyline points="996,280 996,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="1257" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="1267" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="1389.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">MariaDB</text></g><g data-text-box="1" data-x="1267" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="1389.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">users</text></g><polyline points="1389,280 1389,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><polyline points="210,336 603,336" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="603,336 594.0,339.8 594.0,332.2" fill="#2F75B5"/><rect x="223" y="307" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="223" data-y="307" data-width="23" data-height="22"><text x="234.5" y="321.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">1</text></g><g data-text-box="1" data-x="256" data-y="307" data-width="335" data-height="25"><text x="256" y="325.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#2F75B5" text-anchor="start">email · password</text></g><polyline points="603,397 996,397" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="996,397 987.0,400.8 987.0,393.2" fill="#2F75B5"/><rect x="616" y="368" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="616" data-y="368" data-width="23" data-height="22"><text x="627.5" y="382.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">2</text></g><g data-text-box="1" data-x="649" data-y="368" data-width="335" data-height="25"><text x="649" y="386.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#2F75B5" text-anchor="start">이메일 정규화 후 사용자 조회</text></g><polyline points="996,458 1389,458" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="1389,458 1380.0,461.8 1380.0,454.2" fill="#2F75B5"/><rect x="1009" y="429" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="1009" data-y="429" data-width="23" data-height="22"><text x="1020.5" y="443.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">3</text></g><g data-text-box="1" data-x="1042" data-y="429" data-width="335" data-height="25"><text x="1042" y="446.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#2F75B5" text-anchor="start">SELECT users WHERE email = ...</text></g><polyline points="1389,519 996,519" fill="none" stroke="#627187" stroke-width="1.6" stroke-linejoin="miter" stroke-dasharray="7 5"/><polygon points="996,519 1005.0,515.2 1005.0,522.8" fill="#627187"/><g data-text-box="1" data-x="1008" data-y="490" data-width="369" data-height="25"><text x="1008" y="508.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#627187" text-anchor="start">사용자 · password_hash</text></g><polyline points="996,580 603,580" fill="none" stroke="#627187" stroke-width="1.6" stroke-linejoin="miter" stroke-dasharray="7 5"/><polygon points="603,580 612.0,576.2 612.0,583.8" fill="#627187"/><g data-text-box="1" data-x="615" data-y="551" data-width="369" data-height="25"><text x="615" y="569.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#627187" text-anchor="start">User 모델 / 조회 결과 없음</text></g><polyline points="603,622 638,622 638,647 603,647" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="603,647 612.0,643.2 612.0,650.8" fill="#2F75B5"/><g data-text-box="1" data-x="652" data-y="615" data-width="288" data-height="46"><text x="652" y="633.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#243448" text-anchor="start">비밀번호 해시 검증</text><text x="652" y="657.48" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#243448" text-anchor="start">성공 시 JWT 생성</text></g><polyline points="603,705 210,705" fill="none" stroke="#627187" stroke-width="1.6" stroke-linejoin="miter" stroke-dasharray="7 5"/><polygon points="210,705 219.0,701.2 219.0,708.8" fill="#627187"/><g data-text-box="1" data-x="222" data-y="676" data-width="369" data-height="25"><text x="222" y="694.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#627187" text-anchor="start">200 · access_token + user</text></g><polyline points="210,738 245,738 245,763 210,763" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="210,763 219.0,759.2 219.0,766.8" fill="#2F75B5"/><g data-text-box="1" data-x="259" data-y="731" data-width="288" data-height="46"><text x="259" y="748.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#243448" text-anchor="start">JWT를 sessionStorage에 보관</text></g><rect x="65" y="790" width="716" height="61" fill="#F3F6FA" stroke="none" stroke-width="1"/><rect x="65" y="790" width="3" height="61" fill="#2F75B5" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="80" data-y="798" data-width="688" data-height="21"><text x="80" y="814.64" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="700" fill="#17365D" text-anchor="start">인증 실패</text></g><g data-text-box="1" data-x="80" data-y="822" data-width="688" data-height="27"><text x="80" y="837.6" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="15" font-weight="400" fill="#627187" text-anchor="start">미가입 이메일·비밀번호 오류는 동일한 401 응답</text></g><rect x="800" y="790" width="735" height="61" fill="#F3F6FA" stroke="none" stroke-width="1"/><rect x="800" y="790" width="3" height="61" fill="#2F75B5" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="815" data-y="798" data-width="707" data-height="21"><text x="815" y="814.64" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="700" fill="#17365D" text-anchor="start">다음 요청</text></g><g data-text-box="1" data-x="815" data-y="822" data-width="707" data-height="27"><text x="815" y="837.6" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="15" font-weight="400" fill="#627187" text-anchor="start">프론트엔드는 Authorization: Bearer &lt;JWT&gt; 헤더를 추가</text></g></svg>