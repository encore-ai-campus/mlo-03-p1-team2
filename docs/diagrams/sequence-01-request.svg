<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>프론트엔드 요청에서 DB 응답까지</title><desc>Sources: frontend/src/api/client.js; frontend/nginx/templates/default.conf.template; docs/FrontToBackSetting.md §8-1; backend/app/main.py; app/api/router.py; app/api/deps.py; app/db/session.py.
Web proxy lane combines HAProxy .181, nginx .177/.178, HAProxy .179. SQLAlchemy is inside the FastAPI process, not a separate service. SQL reaches MariaDB through HAProxy .180 according to the supplied architecture. get_db creates a request-scoped session and closes it in finally. Handlers explicitly commit writes; read-only requests do not commit. Authenticated endpoints also query users through the same session. Successful handlers are serialized through response_model. Dependency and input validation are summarized without asserting their exact internal execution order.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="62" y="42" width="7" height="42" fill="#2F75B5" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="87" data-y="36" data-width="1420" data-height="58"><text x="87" y="76.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="39" font-weight="700" fill="#17365D" text-anchor="start">프론트엔드 요청에서 DB 응답까지</text></g><g data-text-box="1" data-x="88" data-y="104" data-width="1400" data-height="38"><text x="88" y="124.8" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="20" font-weight="400" fill="#627187" text-anchor="start">요청 개요  |  /api/v1/* 요청이 실제 코드와 배포 경로를 따라 처리되는 과정</text></g><polyline points="62,154 1538,154" fill="none" stroke="#CBD4DF" stroke-width="1" stroke-linejoin="miter"/><g data-text-box="1" data-x="64" data-y="858" data-width="1200" data-height="26"><text x="64" y="872.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="400" fill="#627187" text-anchor="start">TIKIT  /  BACKEND SEQUENCE</text></g><g data-text-box="1" data-x="1400" data-y="858" data-width="138" data-height="26"><text x="1538" y="872.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="400" fill="#627187" text-anchor="end">01 / 06</text></g><rect x="58" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="68" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="190.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">Vue 3</text></g><g data-text-box="1" data-x="68" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="190.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">request() · fetch</text></g><polyline points="190,280 190,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="363" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="373" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="495.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">웹 프록시</text></g><g data-text-box="1" data-x="373" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="495.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">.181 → nginx → .179</text></g><polyline points="495,280 495,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="668" y="201" width="264" height="79" fill="#17365D" stroke="#17365D" stroke-width="1"/><g data-text-box="1" data-x="678" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="800.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"