ints="1410,280 1410,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><polyline points="190,335 495,335" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="495,335 486.0,338.8 486.0,331.2" fill="#2F75B5"/><rect x="203" y="306" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="203" data-y="306" data-width="23" data-height="22"><text x="214.5" y="320.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">1</text></g><g data-text-box="1" data-x="236" data-y="306" data-width="247" data-height="25"><text x="236" y="324.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#2F75B5" text-anchor="start">/api/v1/* · JSON</text></g><polyline points="495,395 800,395" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="800,395 791.0,398.8 791.0,391.2" fill="#2F75B5"/><rect x="508" y="366" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="508" data-y="366" data-width="23" data-height="22"><text x="519.5" y="380.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">2</text></g><g data-text-box="1" data-x="541" data-y="366" data-width="247" data-height="25"><text x="541" y="384.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#2F75B5" text-anchor="start">HTTP :8000</text></g><polyline points="800,442 835,442 835,467 800,467" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="800,467 809.0,463.2 809.0,470.8" fill="#2F75B5"/><g data-text-box="1" data-x="849" data-y="435" data-width="288" data-height="46"><text x="849" y="452.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#243448" text-anchor="start">입력·인증 검증</text><text x="849" y="475.12" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#243448" text-anchor="start">경로 함수 실행</text></g><polyline points="800,522 1105,522" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="1105,522 1096.0,525.8 1096.0,518.2" fill="#2F75B5"/><rect x="813" y="493" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="813" data-y="493" data-width="23" data-height="22"><text x="824.5" y="507.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">3</text></g><g data-text-box="1" data-x="846" data-y="493" data-width="247" data-height="25"><text x="846" y="511.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#2F75B5" text-anchor="start">ORM 조회 / 변경</text></g><polyline points="1105,580 1410,580" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="1410,580 1401.0,583.8 1401.0,576.2" fill="#2F75B5"/><rect x="1118" y="551" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="1118" data-y="551" data-width="23" data-height="22"><text x="1129.5" y="565.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">4</text></g><g data-text-box="1" data-x="1151" data-y="551" data-width="247" data-height="25"><text x="1151" y="567.64" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#2F75B5" text-anchor="start">SQL · 쓰기 시 COMMIT</text></g><polyline points="1410,638 1105,638" fill="none" stroke="#627187" stroke-width="1.6" stroke-linejoin="miter" stroke-dasharray="7 5"/><polygon points="1105,638 1114.0,634.2 1114.0,641.8" fill="#627187"/><g data-text-box="1" data-x="1117" data-y="609" data-width="281" data-height="25"><text x="1117" y="627.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#627187" text-anchor="start">조회 / 저장 결과</text></g><polyline points="1105,696 800,696" fill="none" stroke="#627187" stroke-width="1.6" stroke-linejoin="miter" stroke-dasharray="7 5"/><polygon points="800,696 809.0,692.2 809.0,699.8" fill="#627187"/><g data-text-box="1" data-x="812" data-y="667" data-width="281" data-height="25"><text x="812" y="685.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#627187" text-anchor="start">ORM 모델</text></g><polyline points="800,752 495,752" fill="none" stroke="#627187" stroke-width="1.6" stroke-linejoin="miter" stroke-dasharray="7 5"/><polygon points="495,752 504.0,748.2 504.0,755.8" fill="#627187"/><g data-text-box="1" data-x="507" data-y="723" data-width="281" data-height="25"><text x="507" y="741.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#627187" text-anchor="start">상태 코드 · JSON</text></g><polyline points="495,752 190,752" fill="none" stroke="#627187" stroke-width="1.6" stroke-linejoin="miter" stroke-dasharray="7 5"/><polygon points="190,752 199.0,748.2 199.0,755.8" fill="#627187"/><g data-text-box="1" data-x="202" data-y="723" data-width="281" data-height="25"><text x="202" y="741.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#627187" text-anchor="start">화면에 결과 반영</text></g><rect x="65" y="790" width="716" height="61" fill="#F3F6FA" stroke="none" stroke-width="1"/><rect x="65" y="790" width="3" height="61" fill="#2F75B5" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="80" data-y="79