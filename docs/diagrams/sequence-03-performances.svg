<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>공연 목록 조회</title><desc>Sources: backend/app/api/routes/performances.py; app/schemas/performance.py; frontend/src/views/HomeView.vue; frontend/src/api/client.js.
