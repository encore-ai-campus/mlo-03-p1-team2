<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>예매 요청과 결제 대기 생성</title><desc>Sources: frontend/src/composables/useReservations.js; backend/app/api/routes/reservations.py:create_reservation; app/api/deps.py; app/models/reservation.py; app/schemas/reservation.py.
The initial reads shown together summarize sequential lookups: current JWT user, performance, then (user_id,request_key). Performance existence, date and session are checked before request-key replay. Same key and same fields returns existing reservation with 200; changed fields gives 409. Server price = performance.price + premium surcharge, multiplied by quantity. db.add(r) and db.flush() insert reservation and joined payment; then status_history and optional Event are queued, and db.commit(). Events are only added for consent users; tables are reservations, payments, status_history, events. New success is 201 with ReservationOut; status REQUESTED, payment_status PENDING. A unique constraint on (user_id, request_key) exists. The drawing does not claim every concurrent race has been tested. No external payment gateway is called; payment is simulated.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="62" y="42" width="7" height="42" fill="#2F75B5" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="87" data-y="36" data-width="1420" data-height="58"><text x="87" y="76.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="39" font-weight="700" fill="#17365D" text-anchor="start">예매 요청과 결제 대기 생성</text></g><g data-text-box="1" data-x="88" data-y="104" data-width="1400" data-height="38"><text x="88" y="124.8" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="20" font-weight="400" fill="#627187" text-anchor="start">POST /api/v1/reservations  |  예매·결제·이력을 하나의 DB 트랜잭션으로 저장</text></g><polyline points="62,154 1538,154" fill="none" stroke="#CBD4DF" stroke-width="1" stroke-linejoin="miter"/><g data-text-box="1" data-x="64" data-y="858" data-width="1200" data-height="26"><text x="64" y="872.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="400" fill="#627187" text-anchor="start">TIKIT  /  BACKEND SEQUENCE</text></g><g data-text-box="1" data-x="1400" data-y="858" data-width="138" data-height="26"><text x="1538" y="872.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="400" fill="#627187" text-anchor="end">04 / 06</text></g><rect x="78" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="88" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="210.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">Vue 3</text></g><g data-text-box="1" data-x="88" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="210.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">BookingModal · useReservations</text></g><polyline points="210,280 210,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="471" y="201" width="264" height="79" fill="#17365D" stroke="#17365D" stroke-width="1"/><g data-text-box="1" data-x="481" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="603.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">FastAPI</text></g><g data-text-box="1" data-x="481" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="603.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#E0EAF6" text-anchor="middle">create_reservation()</text></g><polyline points="603,280 603,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="864" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="874" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="996.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">SQLAlchemy</text></g><g data-text-box="1" data-x="874" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="996.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">같은 요청의 Session</text></g><polyline points="996,280 996,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><rect x="1257" y="201" width="264" height="79" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="1"/><g data-text-box="1" data-x="1267" data-y="215.42" data-width="244" data-height="29.040000000000003"><text x="1389.0" y="238.29999999999998" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#243448" text-anchor="middle">MariaDB</text></g><g data-text-box="1" data-x="1267" data-y="244.45999999999998" data-width="244" data-height="21.12"><text x="1389.0" y="261.09999999999997" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#627187" text-anchor="middle">예매 · 결제 · 상태 이력</text></g><polyline points="1389,280 1389,772" fill="none" stroke="#AEBBCA" stroke-width="1.1" stroke-linejoin="miter" stroke-dasharray="7 5"/><polyline points="210,323 603,323" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="603,323 594.0,326.8 594.0,319.2" fill="#2F75B5"/><rect x="223" y="294" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="223" data-y="294" data-width="23" data-height="22"><text x="234.5" y="308.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">1</text></g><g data-text-box="1" data-x="256" data-y="294" data-width="335" data-height="25"><text x="256" y="311.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#2F75B5" text-anchor="start">예매 정보 · request_key · JWT</text></g><polyline points="603,371 996,371" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="996,371 987.0,374.8 987.0,367.2" fill="#2F75B5"/><rect x="616" y="342" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="616" data-y="342" data-width="23" data-height="22"><text x="627.5" y="356.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">2</text></g><g data-text-box="1" data-x="649" data-y="342" data-width="335" data-height="25"><text x="649" y="359.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#2F75B5" text-anchor="start">사용자·공연·기존 요청 키 조회</text></g><polyline points="996,419 1389,419" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="1389,419 1380.0,422.8 1380.0,415.2" fill="#2F75B5"/><rect x="1009" y="390" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="1009" data-y="390" data-width="23" data-height="22"><text x="1020.5" y="404.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">3</text></g><g data-text-box="1" data-x="1042" data-y="390" data-width="335" data-height="25"><text x="1042" y="406.64" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="16" font-weight="400" fill="#2F75B5" text-anchor="start">users / performances / reservations</te