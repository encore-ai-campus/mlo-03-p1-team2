-width="1.6" stroke-linejoin="miter"/><polygon points="996,643 987.0,646.8 987.0,639.2" fill="#2F75B5"/><rect x="616" y="614" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="616" data-y="614" data-width="23" data-height="22"><text x="627.5" y="628.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">4</text></g><g data-text-box="1" data-x="649" data-y="614" data-width="335" data-height="25"><text x="649" y="631.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#2F75B5" text-anchor="start">예매·결제·이력·이벤트 추가</text></g><polyline points="996,690 1389,690" fill="none" stroke="#2F75B5" stroke-width="1.6" stroke-linejoin="miter"/><polygon points="1389,690 1380.0,693.8 1380.0,686.2" fill="#2F75B5"/><rect x="1009" y="661" width="23" height="22" fill="#EAF1F8" stroke="none" stroke-width="1"/><g data-text-box="1" data-x="1009" data-y="661" data-width="23" data-height="22"><text x="1020.5" y="675.56" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F75B5" text-anchor="middle">5</text></g><g data-text-box="1" data-x="1042" data-y="661" data-width="335" data-height="25"><text x="1042" y="678.68" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="17" font-weight="400" fill="#2F75B5" text-anchor="start">flush(INSERT) → COMMIT</text></g><polyline points="1389,737 996,737" fill="none" stroke="#627187" stroke-width="1.6" stroke-linejoin="miter" stroke-dasharray="7 5"/><polygon points="996,737 1005.0,733.2 1005.0,740.8" fill="#627187"/><g data-text-box="1" data-x="1008" data-y="708" data-width="369" data-height="25"><text x="1008" y="726.72" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="18" font-weight="400" fill="#627187" text-anchor="start">저장 완료</text></g><polyline